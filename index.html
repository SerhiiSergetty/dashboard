<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <h1>SOFT/DAY</h1>
    <p>A little room to focus</p>
    <main>
<section class="card">
      <div class="calendar-header">
        <h2>April 2025</h2>
        <button class="calendar-header button">&lt;</button>
        <button class="calendar-header button">&gt;</button>
      </div>
      <div class="weekdays">
        <span>Mon</span>
        <span>Tue</span>
        <span>Wed</span>
        <span>Thu</span>
        <span>Fri</span>
        <span>Sat</span>
        <span>Sun</span>
      </div>
      <div class="days"></div>
</section>
<section class="card">
  <div class="timer-ring">
    <span class="time">25:00</span>
    <span class="time-label">FOCUS</span>
    <span class="time-leaf"></span>
  </div>
  <button class="start-btn">START</button>
</section>
